name: Climbot macOS build.

on:
  push:
    branches: [climbot-api]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: tdesktop

      - name: First set up.
        run: |
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-${{ hashFiles(format('tdesktop/{0}', env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Libraries.
        run: ./tdesktop/Telegram/build/prepare/mac.sh skip-release silent

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      - name: Build.
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          ZIP_KEY: ${{ secrets.TG_BUILD_ZIP_KEY }}
        run: |
          cd tdesktop/Telegram
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ] || [ -z "$ZIP_KEY" ]; then
            echo "Need TG_API_ID, TG_API_HASH and TG_BUILD_ZIP_KEY secrets." && exit 1
          fi
          API="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            $API
          cmake --build ../out --config Release --parallel
          # The binary holds api_hash and the fork is public: ship it encrypted.
          cd ../out/Release && ditto -c -k --keepParent Telegram.app ../Telegram.zip
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ZIP_KEY -in ../Telegram.zip -out ../Telegram.zip.enc
          rm ../Telegram.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Telegram
          path: tdesktop/out/Telegram.zip.enc
          retention-days: 7
